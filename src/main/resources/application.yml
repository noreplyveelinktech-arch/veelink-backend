server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veelink_cms}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # Neon's free tier can auto-suspend the compute / drop idle connections well before
      # Hikari's own defaults (30 min max-lifetime) would recycle them, causing
      # "Failed to validate connection ... connection has been closed" warnings and failed
      # requests. Keeping connections short-lived and validated forces Hikari to refresh
      # them proactively instead of handing out ones Neon already closed.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mail:
  from: ${MAIL_FROM:no-reply@example.com}
  from-name: ${MAIL_FROM_NAME:Veelink Technologies}

brevo:
  api-key: ${BREVO_API_KEY:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  secret: ${JWT_SECRET:changeThisSecretKeyToSomethingLongAndRandomForProductionUse}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  # Comma-separated list of allowed CORS origins, e.g. https://veelink-frontend.vercel.app,http://localhost:5173
  frontend-url: ${FRONTEND_URL:http://localhost:5173}