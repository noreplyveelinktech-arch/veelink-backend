server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veelink_cms}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

brevo:
  api:
    key: ${BREVO_API_KEY:}

mail:
  from: ${MAIL_FROM:noreply@veelinktech.com}
  from-name: ${MAIL_FROM_NAME:Veelink Technologies}

jwt:
  secret: ${JWT_SECRET:changeThisSecretKeyToSomethingLongAndRandomForProductionUse}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}